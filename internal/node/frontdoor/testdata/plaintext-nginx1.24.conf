            grpc_pass grpc://observex_gateway_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Request-ID $request_id;
            grpc_set_header X-ObserveX-Client-Verify $observex_client_verify;
            grpc_set_header X-ObserveX-Client-DN "";
            grpc_set_header X-ObserveX-Client-Cert "";
            grpc_connect_timeout 2s;
            grpc_send_timeout 30s;
            grpc_read_timeout 60s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /opentelemetry.proto.collector.trace.v1.TraceService/Export {
            if ($request_method != POST) {
                return 405;
            }
            grpc_pass grpc://observex_gateway_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Request-ID $request_id;
            grpc_set_header X-ObserveX-Client-Verify $observex_client_verify;
            grpc_set_header X-ObserveX-Client-DN "";
            grpc_set_header X-ObserveX-Client-Cert "";
            grpc_connect_timeout 2s;
            grpc_send_timeout 30s;
            grpc_read_timeout 60s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /v1/metrics {
            if ($request_method != POST) {
                return 405;
            }
            proxy_pass http://observex_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-ObserveX-Client-Verify $observex_client_verify;
            proxy_set_header X-ObserveX-Client-DN "";
            proxy_set_header X-ObserveX-Client-Cert "";
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /v1/logs {
            if ($request_method != POST) {
                return 405;
            }
            proxy_pass http://observex_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-ObserveX-Client-Verify $observex_client_verify;
            proxy_set_header X-ObserveX-Client-DN "";
            proxy_set_header X-ObserveX-Client-Cert "";
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /v1/traces {
            if ($request_method != POST) {
                return 405;
            }
            proxy_pass http://observex_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-ObserveX-Client-Verify $observex_client_verify;
            proxy_set_header X-ObserveX-Client-DN "";
            proxy_set_header X-ObserveX-Client-Cert "";
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 404 '{"error":"not found"}\n';
        }

        location @forbidden {
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 403 '{"error":"client certificate required"}\n';
        }

        location @method_not_allowed {
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 405 '{"error":"method not allowed"}\n';
