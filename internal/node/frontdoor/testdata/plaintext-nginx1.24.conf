    }

    # Loopback listener for the supervisor's liveness probe.
    server {
        listen 127.0.0.1:8181;
        set $observex_listener probe;
        set $observex_client_verify "";
        access_log off;

        location = /livez {
            return 200 '{"status":"alive"}\n';
        }

        location / {
            return 404 '{"error":"not found"}\n';
        }
    }
}

