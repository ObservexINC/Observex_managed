# Generated by observex-node. Do not edit: it is rewritten at every start.
daemon off;
worker_processes 2;
pid /run/observex/frontdoor/nginx.pid;
# NGINX writes the request line, query string included, into error-level
# messages, and that format cannot be changed. Only critical messages are
# logged; failed requests show in the JSON access log.
error_log stderr crit;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    default_type application/json;
    charset utf-8;

    client_body_temp_path /run/observex/frontdoor/client_body;
    proxy_temp_path /run/observex/frontdoor/proxy;
    fastcgi_temp_path /run/observex/frontdoor/fastcgi;
    uwsgi_temp_path /run/observex/frontdoor/uwsgi;
    scgi_temp_path /run/observex/frontdoor/scgi;

    # One JSON line per request: the path without its query string, and no
    # headers, so no credential reaches the log.
    log_format observex_json escape=json '{"time":"$time_iso8601","listener":"$observex_listener","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","path":"$uri","protocol":"$server_protocol","status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_status":"$upstream_status","client_verify":"$observex_client_verify"}';
    access_log /dev/stdout observex_json;

    client_max_body_size 16777216;
    client_body_buffer_size 128k;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 16k;

    upstream observex_server {
        server 127.0.0.1:8182;
        keepalive 16;
    }

    upstream observex_gateway {
        server 127.0.0.1:8183;
        keepalive 16;
    }

    upstream observex_gateway_grpc {
        server 127.0.0.1:8183;
        keepalive 16;
    }

    upstream observex_supervisor {
        server 127.0.0.1:8180;
    }

    # Console listener: Console, API and node health. Never asks for a
    # client certificate.
    server {
        listen 0.0.0.0:8080;
        server_name _;
        set $observex_listener console;
        set $observex_client_verify "";

        error_page 403 = @forbidden;
        error_page 405 = @method_not_allowed;
        error_page 413 = @too_large;
        error_page 502 503 504 = @unavailable;

        location = /node/health {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            proxy_pass http://observex_supervisor/health;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            proxy_pass http://observex_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            # The Console listener never verifies client certificates, so
            # these headers are always removed.
            proxy_set_header X-ObserveX-Client-Verify "";
            proxy_set_header X-ObserveX-Client-DN "";
            proxy_set_header X-ObserveX-Client-Cert "";
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location @forbidden {
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 403 '{"error":"client certificate required"}\n';
        }

        location @method_not_allowed {
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 405 '{"error":"method not allowed"}\n';
        }

        location @too_large {
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 413 '{"error":"request body too large"}\n';
        }

        location @unavailable {
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"error":"service unavailable"}\n';
        }
    }

    # Agents listener: Agents and Gateways. Plaintext, so no
    # client certificate can be asked for or required.
    server {
        listen 0.0.0.0:8443;
        server_name _;
        set $observex_listener agents;
        # Plaintext (development only): no certificate can be checked.
        set $observex_client_verify NONE;

        error_page 403 = @forbidden;
        error_page 405 = @method_not_allowed;
        error_page 413 = @too_large;
        error_page 502 503 504 = @unavailable;

        location = /node/health {
            if ($request_method !~ ^(GET|HEAD)$) {
