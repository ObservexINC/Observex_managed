            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /observex.agent.v1.EnrollmentService/Enroll {
            if ($request_method != POST) {
                return 405;
            }
            grpc_pass grpc://observex_gateway_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Request-ID $request_id;
            grpc_set_header X-ObserveX-Client-Verify $observex_client_verify;
            grpc_set_header X-ObserveX-Client-DN "";
            grpc_set_header X-ObserveX-Client-Cert "";
            grpc_connect_timeout 2s;
            grpc_send_timeout 30s;
            grpc_read_timeout 60s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /observex.agent.v1.EnrollmentService/GetConfig {
            if ($request_method != POST) {
                return 405;
            }
            grpc_pass grpc://observex_gateway_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Request-ID $request_id;
            grpc_set_header X-ObserveX-Client-Verify $observex_client_verify;
            grpc_set_header X-ObserveX-Client-DN "";
            grpc_set_header X-ObserveX-Client-Cert "";
            grpc_connect_timeout 2s;
            grpc_send_timeout 30s;
            grpc_read_timeout 60s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /observex.ingest.v1.IngestService/Send {
            if ($request_method != POST) {
                return 405;
            }
            grpc_pass grpc://observex_gateway_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Request-ID $request_id;
            grpc_set_header X-ObserveX-Client-Verify $observex_client_verify;
            grpc_set_header X-ObserveX-Client-DN "";
            grpc_set_header X-ObserveX-Client-Cert "";
            grpc_connect_timeout 2s;
            grpc_send_timeout 30s;
            grpc_read_timeout 60s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /opentelemetry.proto.collector.metrics.v1.MetricsService/Export {
            if ($request_method != POST) {
                return 405;
            }
            grpc_pass grpc://observex_gateway_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Request-ID $request_id;
            grpc_set_header X-ObserveX-Client-Verify $observex_client_verify;
            grpc_set_header X-ObserveX-Client-DN "";
            grpc_set_header X-ObserveX-Client-Cert "";
            grpc_connect_timeout 2s;
            grpc_send_timeout 30s;
            grpc_read_timeout 60s;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /opentelemetry.proto.collector.logs.v1.LogsService/Export {
            if ($request_method != POST) {
                return 405;
