name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job runs on Ubuntu 24.04, not ubuntu-latest, so NGINX, OpenSSL and
# ShellCheck stay at known versions; moving to a newer image is a decision of
# its own (akash, 22 October 2026). The actions are the major versions that
# run on Node.js 24 (GitHub removed Node.js 20 on 23 September 2026).
jobs:
  go:
    name: Go build and tests (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 1.27 is the toolchain (T1) and the language level in go.mod. The
        # 1.24 leg ended in G02, when go.mod moved to 1.27 (ADR 0002).
        go: ["1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      # The Front Door tests run NGINX for real; without it they skip.
      - name: Install NGINX
        run: sudo apt-get update -q && sudo apt-get install -y -q nginx-core
      - name: Format, vet, build, race tests, coverage
        run: make ci-local
      - name: Fuzz (time-boxed)
        run: make fuzz FUZZTIME=30s
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-go-${{ matrix.go }}
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: Lint, vulnerabilities, secrets, licences, schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      # Tools are installed through the Go module proxy with checksum
      # verification, at the versions pinned in the Makefile.
      - name: Install tools
        run: make tools
      - name: Lint
        run: make lint
      - name: Vulnerabilities (source)
        run: make vuln
      - name: Vulnerabilities (the binary in the node tarball)
        run: make vuln-package VERSION=ci
      - name: Secrets
        run: make secrets
      - name: Licences
        run: make licenses
      - name: Protobuf lint and format
        run: make proto-lint
      - name: Shell scripts
        run: |
          sudo apt-get install -y -q shellcheck
          make shell-check

  engines:
    name: Store adapters against Cassandra and OpenSearch
    runs-on: ubuntu-24.04
    # Plain HTTP and no authentication here: the tarball rig
    # (test/rig/engines-tarball.sh) and Astra's compose run exercise
    # PasswordAuthenticator, HTTPS and basic authentication.
    services:
      cassandra:
        image: cassandra:5.0.9
        env:
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 10s --health-timeout 10s --health-retries 30
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Contract suites and adapter tests on the real engines
        env:
          OBSERVEX_TEST_CASSANDRA: 127.0.0.1:9042
          OBSERVEX_TEST_OPENSEARCH: http://127.0.0.1:9200
        run: make test-engines

  node-install:
    name: Node tarball install test (systemd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install NGINX
        run: sudo apt-get update -q && sudo apt-get install -y -q nginx-core
      - name: Build the tarball and test it under a temporary root
        run: make install-test VERSION=ci
      # The runner is a fresh VM with systemd: install for real, kill NGINX,
      # check the restart, uninstall.
      - name: Live install test
        run: sudo packaging/linux/test-install.sh live dist/observex-managed-node-ci-linux-amd64.tar.gz
