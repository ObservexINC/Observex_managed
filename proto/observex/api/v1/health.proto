syntax = "proto3";

package observex.api.v1;

option go_package = "github.com/Voxmatic/observe/internal/api/observex/api/v1;apiv1";

// HealthService reports whether a process is ready. Every ObserveX process
// serves it; the Node Supervisor and NGINX Front Door use it.
service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  // Component to check, for example "intake". Empty checks the process.
  string component = 1;
}

enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING_STATUS_SERVING = 1;
  SERVING_STATUS_NOT_SERVING = 2;
  SERVING_STATUS_DEGRADED = 3;
}

message CheckResponse {
  ServingStatus status = 1;
  // Short reason when not serving. Never contains secrets.
  string detail = 2;
}
